name: Deploy Laravel to Production

on:
  push:
    branches:
      - main

jobs:
  # Production deploys are gated: no green suite, no deploy.
  quality:
    uses: ./.github/workflows/quality.yaml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    # An SSH step that hangs would otherwise hold the deploy open for hours
    # with the application left in maintenance mode.
    timeout-minutes: 15

    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        # NO agregar `script_stop` aca. Se probo el 2026-08-22 y la accion lo
        # rechaza —"Unexpected input(s) 'script_stop'"— porque ya no figura entre
        # sus inputs validos. Un knob que la accion ignora es peor que ninguno:
        # se lee como un guardian y no guarda nada.
        script: |
          # Este paso NO PODIA ponerse rojo. El estado de una sesion SSH es el de
          # su ultimo comando, y el ultimo comando de abajo es un `echo`, que
          # nunca falla. Una migracion que reventaba dejaba seguir el script:
          # cacheaba la config, recargaba FPM, levantaba el sitio con codigo
          # nuevo contra esquema viejo, y reportaba exito. Esa es exactamente la
          # forma del incidente del 2026-08-19 —el `NaN` de Pareto— pero sin
          # nada que mirar.
          #
          # `set -e` es la primera capa. No es la unica, y la razon es concreta:
          # la accion ya elimino un input sin aviso, y este deploy no puede
          # apoyarse en una semantica que nadie puede comprobar sin romper
          # produccion. `run` verifica el codigo de salida a mano y hace `exit 1`
          # explicito. Eso la sesion SSH lo propaga siempre, con `set -e` o sin
          # el, y se puede afirmar leyendolo.
          set -e

          run() {
            echo "→ $*"
            if ! "$@"; then
              echo "::error::Deploy abortado, fallo: $*"
              exit 1
            fi
          }

          cd "${{ secrets.PROJECT_PATH }}" || exit 1

          # 1. Arreglar la propiedad de los archivos
          run sudo chown -R www-data:www-data .

          # 2. Poner en modo mantenimiento COMO www-data
          #
          # A partir de aca, cualquier comando que falle CORTA el script y deja
          # el sitio en mantenimiento hasta que alguien lo mire. Es deliberado y
          # es la mitad cara del trato: un sitio en mantenimiento se ve, un
          # esquema desalineado sirviendo trafico no.
          #
          # Esta linea es la unica excepcion y sigue siendo intencional: `down`
          # falla si el sitio ya estaba abajo, y eso no aborta nada.
          sudo -u www-data php artisan down || true

          # 3. Obtener el código más reciente COMO www-data
          run sudo -u www-data git pull

          # 4. Instalar dependencias COMO www-data
          run sudo -u www-data composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

          # 5. Ejecutar migraciones y cachés COMO www-data
          run sudo -u www-data php artisan migrate --force
          run sudo -u www-data php artisan optimize:clear
          run sudo -u www-data php artisan config:cache
          run sudo -u www-data php artisan route:cache
          run sudo -u www-data php artisan view:cache

          # 6. Recargar PHP-FPM (Zero Downtime)
          echo "Recargando PHP-FPM para aplicar los cambios (Zero Downtime)..."
          # CAMBIO: Usamos 'reload' en lugar de 'restart'
          run sudo systemctl reload php8.4-fpm

          # 7.  Reiniciar Horizon COMO www-data
          echo "Reiniciando los workers de Horizon..."
          run sudo -u www-data php artisan horizon:terminate

          # 8. Sacar del modo mantenimiento COMO www-data
          run sudo -u www-data php artisan up
          
          # 9. Publicar la lista de comandos del bot.
          #
          # Va DESPUES de `artisan up` a proposito. La lista vive en el enum
          # `BotCommand` y Telegram solo la conoce cuando alguien le llama a
          # `setMyCommands`, asi que sin este paso una descripcion editada en el
          # codigo nunca llega al cliente: el cambio esta desplegado y es
          # invisible. Es idempotente, `setMyCommands` pisa la lista entera.
          #
          # Si falla, el paso se pone rojo y el operador se entera —el comando
          # devuelve FAILURE a proposito, para que un deploy no mienta sobre
          # haber publicado— pero la aplicacion ya esta arriba y sirviendo. Antes
          # de `up`, una caida de Telegram dejaria el sitio en mantenimiento.
          #
          # CORRECCION 2026-08-22: esa frase fue falsa desde que se escribio. El
          # `echo` de abajo le pisaba el codigo de salida y el paso terminaba
          # verde igual. Recien es cierta ahora, con `run`. Se deja escrito
          # porque el error no fue el comando: fue dar por existente un guardian
          # sin comprobarlo.
          echo "Publicando la lista de comandos del bot..."
          run sudo -u www-data php artisan app:register-telegram-commands

          echo "✅ ¡Despliegue completado exitosamente!"