name: Deploy Laravel to Production

on:
  push:
    branches:
      - main

jobs:
  # Production deploys are gated: no green suite, no deploy.
  quality:
    uses: ./.github/workflows/quality.yaml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    # An SSH step that hangs would otherwise hold the deploy open for hours
    # with the application left in maintenance mode.
    timeout-minutes: 15

    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        # Sin esto el paso NO PUEDE ponerse rojo. El estado de la sesion SSH es
        # el del ultimo comando, y el ultimo comando de abajo es un `echo` que
        # nunca falla: una migracion que reventaba dejaba seguir el script,
        # cacheaba la config, levantaba el sitio con codigo nuevo contra esquema
        # viejo, y reportaba exito. Eso es exactamente la forma del incidente del
        # 2026-08-19, pero silencioso.
        #
        # Va duplicado con el `set -e` del script a proposito. `script_stop` es
        # la via documentada de la accion, `set -e` funciona igual si la accion
        # cambia de implementacion; ninguno de los dos se puede probar sin
        # romper produccion, y el costo de que el elegido no aplique es otro
        # deploy verde que miente.
        script_stop: true
        script: |
          set -e

          cd ${{ secrets.PROJECT_PATH }}

          # 1. Arreglar la propiedad de los archivos
          sudo chown -R www-data:www-data .
          
          # 2. Poner en modo mantenimiento COMO www-data
          #
          # A partir de aca, cualquier comando que falle CORTA el script y deja
          # el sitio en mantenimiento hasta que alguien lo mire. Es deliberado y
          # es la mitad cara del trato: un sitio en mantenimiento se ve, un
          # esquema desalineado sirviendo trafico no.
          #
          # El `|| true` de esta linea sigue siendo intencional: `down` falla si
          # ya estaba abajo, y eso no es un motivo para abortar un deploy.
          sudo -u www-data php artisan down || true
          
          # 3. Obtener el código más reciente COMO www-data
          sudo -u www-data git pull
          
          # 4. Instalar dependencias COMO www-data
          sudo -u www-data composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          
          # 5. Ejecutar migraciones y cachés COMO www-data
          sudo -u www-data php artisan migrate --force
          sudo -u www-data php artisan optimize:clear
          sudo -u www-data php artisan config:cache
          sudo -u www-data php artisan route:cache
          sudo -u www-data php artisan view:cache
          
          # 6. Recargar PHP-FPM (Zero Downtime)
          echo "Recargando PHP-FPM para aplicar los cambios (Zero Downtime)..."
          # CAMBIO: Usamos 'reload' en lugar de 'restart'
          sudo systemctl reload php8.4-fpm
          
          # 7.  Reiniciar Horizon COMO www-data
          echo "Reiniciando los workers de Horizon..."
          sudo -u www-data php artisan horizon:terminate
          
          # 8. Sacar del modo mantenimiento COMO www-data
          sudo -u www-data php artisan up
          
          # 9. Publicar la lista de comandos del bot.
          #
          # Va DESPUES de `artisan up` a proposito. La lista vive en el enum
          # `BotCommand` y Telegram solo la conoce cuando alguien le llama a
          # `setMyCommands`, asi que sin este paso una descripcion editada en el
          # codigo nunca llega al cliente: el cambio esta desplegado y es
          # invisible. Es idempotente, `setMyCommands` pisa la lista entera.
          #
          # Si falla, el paso se pone rojo y el operador se entera —el comando
          # devuelve FAILURE a proposito, para que un deploy no mienta sobre
          # haber publicado— pero la aplicacion ya esta arriba y sirviendo. Antes
          # de `up`, una caida de Telegram dejaria el sitio en mantenimiento.
          #
          # CORRECCION 2026-08-22: esa frase fue falsa desde que se escribio. El
          # `echo` de abajo le pisaba el codigo de salida y el paso terminaba
          # verde igual. Recien es cierta ahora, con `set -e` y `script_stop`
          # arriba. Se deja escrito porque el error no fue el comando: fue creer
          # que un guardian existia sin comprobarlo.
          echo "Publicando la lista de comandos del bot..."
          sudo -u www-data php artisan app:register-telegram-commands
          
          echo "✅ ¡Despliegue completado exitosamente!"