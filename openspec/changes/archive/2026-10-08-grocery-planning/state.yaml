      POST /shopping/products. Also carries the three stale `.agents/rules/*` path fixes in
      openspec/config.yaml (lines 34-36, 106, 114) and the CLAUDE.md:45 correction — that
      line claims "No migration uses `fk_`", which is false: constraints at lines 111, 117,
