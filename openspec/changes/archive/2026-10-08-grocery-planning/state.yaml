capabilities:
  new:
    - name: shopping
      summary: Product catalogue, pantry state, declared consumption habits, the computed weekly list, and the grocery budget link.
  modified: [] # Categorization and Financial Analysis are consumed through existing contracts; no requirement of theirs changes.

quality_drivers: [QA-4, QA-3, QA-1, QA-7]
quality_notes: |
  QA-4 safety is satisfied by construction: no code path writes a Transaction.
  QA-3 integrity is what the pin protects — name-matching fails silently and an absent
  ceiling must never be reported as zero.
  QA-1 friction is what this change COSTS: the habits must be hand-declared once.
  QA-7 modifiability is why `products` stays free of seasonality and price columns, so
  phases 2 and 3 land as purely additive migrations.

engram_topic_keys:
  explore: sdd/grocery-planning/explore
  propose: sdd/grocery-planning/proposal
  spec: sdd/grocery-planning/spec
  design: sdd/grocery-planning/design
  tasks: sdd/grocery-planning/tasks
  apply-progress: sdd/grocery-planning/apply-progress

scope:
  decided: |
    One-way, read-only relationship with Wajaycha. Wajaycha feeds the plan; this capability
    never writes a Transaction back. Owner decision, 2026-09-26.
  phase_1:
    - canonical product catalogue (global reference table, no user_id)
    - per-user pantry with acquisition_source enum, quantity, unit and nullable expiry
    - per-user declared consumption habits
    - weekly shopping list computed on read, NOT persisted
    - grocery spend ceiling read from the pinned category's monthly_budget
    - grocery_budget_links — per-user pin of the grocery category, composite (category_id, user_id) FK with ON DELETE CASCADE

out_of_scope:
  - id: seasonality
    summary: Seasonality windows per product.
    disposition: phase 2. MIDAGRI/SIEA publishes a machine-readable national harvest calendar as JSON (157 crops, monthly harvest percentages), so this is curated data rather than an integration.
  - id: live-prices
    summary: Same-week price data.
    disposition: phase 3. A genuinely new external-integration class — no scraping or non-AI outbound HTTP exists in app/ today. Deferred because it is the only piece whose contract can vanish without notice, not because it is expensive.
  - id: write-back
    summary: Turning a plan into a Transaction.
    disposition: excluded by the owner's one-way decision.
  - id: receipt-line-items
    summary: Extracting basket lines from receipt photographs.
    disposition: excluded. Would require amending the normative Detail-is-not-a-line-item rule.
  - id: unit-conversion
    summary: Converting between kg, atado, paquete and unidad.
    disposition: later change, behind the same Unit enum. Phase 1 pins one canonical unit per product and treats a mismatch as a validation error.
  - id: non-food
    summary: Cleaning supplies and other non-food household goods.
    disposition: out of a food-only phase 1; do not hardcode food-only in a way that blocks broadening later.

risks:
  - RESOLVED by propose — category identification is bound to lazy-resolve-then-pin with an absent (never zero) ceiling before a link exists.
  - Manual setup is unavoidable and certain, not a risk to mitigate away — roughly 20-40 staples entered once. A seeded products catalogue reduces typing, not the decision.
  - A stale consumption habit silently corrupts the list. Mitigated by showing why each line exists (habit quantity minus pantry quantity) so a wrong line is legible at its source.
  - The pantry is only as good as the user's logging discipline. Out of reach in phase 1; nothing enforces it.
  - docs/domain/ubiquitous-language.md needs new terms for product, pantry item and consumption habit, each stating what it is NOT. That file is Spanish by owner decision while openspec artifacts are English.
  - openspec/config.yaml needs a new subdomain entry; note it does not currently list Financial Coaching either, a pre-existing drift not to repeat.
  - The 400-line review budget is exceeded by every slice. Five slices is a long chain.
  - "GET /shopping/weekly-plan may WRITE the pin on first use. Idempotent and guarded by unq_grocery_budget_links_user_id, but it is a side effect on a read; name it in the PR so reviewers see it rather than discover it."
  - "Mid-week expiry under-buys. An item expiring Thursday still counts as available when the week's list is computed on Monday, so the list says it is covered even though it will have expired before the weekend shop. This follows directly from the owner's q4 rule, which reads 'past expires_on'. Design surfaces it via soonestExpiryOn rather than hiding it. Revisit if the under-buying is felt in practice."
  - "pantry_items.product_id stays a plain single-column FK. A composite guard is impossible because global products carry user_id IS NULL and MATCH SIMPLE can never satisfy a non-null referencing pair. Exposure is a product NAME only; it becomes worth guarding when products gains a price in phase 3."
  - "PaymentServicesSeeder uses PaymentService::insert() and duplicates its rows on a second run (verified). The catalogue seeder copies where that seeder's data lives, not how it writes — use Product::upsert(uniqueBy: ['slug'])."

open_questions:
  - id: q1
    question: Which week does "weekly" mean?
    assumed: Monday-to-Sunday local week, not a rolling 7 days, because the shop is a fixed weekly event.
    status: CONFIRMED by owner 2026-10-08
    decision: |
      Monday-to-Sunday in America/Lima, confirmed. The owner wants the week to be user-configurable
      (for example Monday-to-Saturday); that is deferred to phase 2 by owner decision.
  - id: q2
    question: Is the seeded products catalogue curated by us or built by the user?
    assumed: We seed roughly 40 Peruvian staples so the first list is possible without typing; the user may add their own.
    status: CONFIRMED by owner 2026-09-26
    decision: |
      Seed roughly 40 Peruvian staples with their canonical unit (papa, arroz, pollo, palta,
      cebolla, tomate and the like). This is the only lever that reduces the manual setup cost,
      because the user then picks from a list instead of typing. It enlarges slice 1 knowingly.
      The owner was offered an empty catalogue and a smaller 10-15 item seed and chose the fuller
      seed.
  - id: q3
    question: Can the user add a product the catalogue lacks?
    assumed: Yes. Otherwise the catalogue becomes a ceiling on the product.
    status: CONFIRMED by owner 2026-10-08
    decision: |
      Yes. Users may add products outside the seeded catalogue; such rows are private to the user
      (products.user_id, see design D3).
  - id: q4
    question: Does an expired pantry item still subtract from the list?
    assumed: No. Past expires_on it stops counting as available, but the row is kept rather than deleted.
    status: CONFIRMED by owner 2026-09-26
    decision: |
      Past expires_on the item stops subtracting from the list, so it reappears as something to
      buy. The row is KEPT — neither deleted nor auto-archived — because the history of what
      expires is the signal for buying less of it next time. The owner was offered "counts until
      you mark it consumed" and "auto-archive on expiry" and rejected both.
  - id: q5
    question: Does the list show money at all, or only quantities?
    assumed: Quantities plus the remaining ceiling. Per-line cost needs prices, which is phase 3.
    status: OVERRIDDEN by owner 2026-10-08
    decision: |
      The owner overrode the assumption: the list must carry per-product PRICES, not phase 3.
      This is NOT delivered by grocery-planning. It requires a new SDD change (explore first).
      Candidate price sources recorded in Engram: MIDAGRI SISAP wholesale (obs #307, fragile HTML
      scrape over http) and VTEX supermarket APIs (obs #307, terms of service unread). The SIEA
      calendar gives seasonality only, no prices (obs #306).
  - id: q6
    question: When the ceiling is already exceeded, does the list change?
    assumed: No. It states the overspend and still shows what is needed; suppressing needed food to protect a budget line is the wrong default.
    status: CONFIRMED by owner 2026-09-26
    decision: |
      The list states the overspend and still shows everything needed. It does NOT prioritise
      within the ceiling and does NOT hide lines. The budget is information, not a gate. The
      owner was offered "prioritise inside the ceiling" and "warn separately without touching the
      list" and rejected both; the first was also rejected on capability grounds, since phase 1
      has no notion of which food matters more.
  - id: q7
    question: Is one pinned category per user enough?
    assumed: Yes for phase 1. Splitting groceries across two categories is a phase-2 question.
    status: CONFIRMED by owner 2026-10-08
    decision: |
      One category per user, confirmed. The owner wants the budget category selectable per user with
      Supermercado as the default; this is already implemented (lazy resolve of the Supermercado
      category, and PUT shopping/grocery-budget-link accepts any category_id).

rollback: |
  All four migrations are purely additive — no existing column, constraint or row is modified.
  Nothing touches queues or the Gemini integration.
  Slice 1 reverts with DROP TABLE products; the enum and docs are code and text only.
  Slice 2 reverts with DROP TABLE pantry_items; products is unaffected.
  Slice 3 reverts with DROP TABLE consumption_habits.
  Slice 4 reverts with DROP TABLE grocery_budget_links; categories is untouched, so dropping it
  loses the link and no budget data.
  Slice 5 reverts by reverting the commit — the list was never stored.
  Safe revert order is 5 -> 4 -> 3 -> 2 -> 1. To disable the capability without a deploy, remove
  the pin row: the list still computes and the ceiling reports absent.
