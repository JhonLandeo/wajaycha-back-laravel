phases:
  explore:
    status: complete
    artifact: exploration.md
    note: |
      The explore phase agent has no file-write tool, so it saved to Engram only
      (observation 308, topic key `sdd/grocery-planning/explore`). The orchestrator wrote
      this file back and, while doing so, verified the phase's load-bearing claims against
      the code: `expenseByCategoryBetween` exists as described, `App\Enums\BudgetPeriod`
      exists, and the `FinancialEntity::BCP_ID` seeded-id caveat reads as quoted.
      One claim was CORRECTED — `category_pareto_assignments` uses a plain unique
      `category_id` FK with no `user_id`, not the composite `(id, user_id)` pattern. Its
      shape is the precedent to copy; its FK is not.
  propose:
    status: complete
    artifact: proposal.md
    depends_on: [explore]
    note: |
      BOUND: category identification is lazy-resolve-then-pin. Resolve `🛒 Supermercado` by
      name once on first use, persist the `category_id` in a new per-user
      `grocery_budget_links` table, never consult the name again. The seed-time alternative
      was rejected because it needs a backfill migration for already-seeded users (the owner
      is one) while covering no case lazy resolution misses.

      Two sub-cases bound with it:
      - No link yet, or the name no longer matches: the list still computes; the ceiling is
        returned ABSENT, never zero. The silent zero is the bug F3 exists to prevent.
      - Deleting the pinned category: the pin's composite FK carries ON DELETE CASCADE, so the
        pin dies with the category and the capability returns to the no-link state. RESTRICT
        (the default, and what enforce_cross_user_ownership uses for transactions) would make
        an unrelated SPA delete fail with a constraint error the UI cannot explain. Verified:
        `App\Models\Category` does NOT use SoftDeletes, so the delete is physical.

      The consumption model was already CLOSED by the owner on 2026-09-26 (explicit declared
      weekly consumption) and the proposal states the manual setup cost plainly rather than
      softening it: roughly 20-40 staples entered once, maintained as habits change.

      Table count is FOUR, not three: the three domain tables plus `grocery_budget_links`,
      which copies the SHAPE of `category_pareto_assignments` and not its FK.
  spec:
    status: complete
    artifact: specs/shopping/spec.md
    depends_on: [propose]
    note: |
      New capability `shopping`: 9 requirements, 19 Given/When/Then scenarios, each traced to
      a ranked quality attribute as config.yaml requires. Scenarios are tabular rather than
      narrative bullets because the phase skill's 650-word budget conflicts with the
      narrative style of the existing ingestion/coaching specs; coverage was preserved.

      AMENDED by the orchestrator after tasks flagged a contradiction. The original
      "Global product catalogue" requirement said a user-submitted product was "created
      global, visible to all". Spec ran in parallel with design and could not see D3, which
      made products.user_id nullable so a user's own addition stays private. The requirement
      is now "Seeded global catalogue with private extension", with a third scenario proving
      user B cannot see user A's addition. Design D3 is binding; the spec now matches it.
  design:
    status: complete
    artifact: design.md
    depends_on: [propose]
    note: |
      Nine binding decisions (D1-D9). The load-bearing ones:
      - D1 `ShoppingPlanService` IS the pure decider; no separate builder, because a
        service-plus-builder pair would leave the "one owning Service" of ADR-0005 naming a
        class that decides nothing.
      - D2 two contracts; the composition of CategoryRepositoryContract and
        expenseByCategoryBetween() lives inside GroceryBudgetRepository, not the Action.
      - D3 `products.user_id` NULLABLE — global catalogue plus private extension. This
        overrides the proposal's pure-global table, which could not satisfy q3 without
        leaking one user's product name into every other user's picker. The orchestrator
        independently reached the same conclusion while reviewing the spec.
      - D5 the ceiling has THREE states (unlinked / unbudgeted / set), because a pinned
        category with a zero budget is not the same fact as no link at all.
      - D6 the pin is written on a GET; unq_grocery_budget_links_user_id is the concurrency
        arbiter. Named explicitly as a side effect on a read so reviewers see it.
      - D7 no API Resources layer. Verified: nothing under app/ imports JsonResource.
      - D9 adopt the `fk_` prefix.
      q6 is guaranteed STRUCTURALLY, not by discipline: plan() derives lines from
      (habits, pantry, week) and the ceiling from (ceiling, week), sharing no term, so an
      exceeded ceiling cannot reorder or hide a line. Likewise the pure service never reads
      acquisition_source, so no path can make a gift touch a Transaction.
  tasks:
    status: complete
    artifact: tasks.md
    depends_on: [spec, design]
    note: |
      Re-forecast against FIVE backend-only slices (owner decided frontend is deferred —
      see frontend_scope below), not design's six-slice ~1,940 or the proposal's five-slice
      ~1,490 (which counted no frontend at all). Concrete task list totals ≈1,540 authored
      lines. Every individual slice estimate (380/320/240/300/300) stays at or under ~380,
      but slice 1 is close enough to 400, and the aggregate large enough, that the forecast
      is kept at High risk with chained/stacked commits rather than downgraded on estimate
      alone. Flagged one spec/design tension: specs/shopping/spec.md's "created global,
      visible to all" scenario for user-submitted products predated design D3. Tasks
      correctly followed D3 (binding) and recorded the gap at task 1.9.
      RESOLVED by the orchestrator: the spec requirement was amended to match D3 before
      apply, so task 1.9 now traces to a spec that agrees with it. No task change needed.
