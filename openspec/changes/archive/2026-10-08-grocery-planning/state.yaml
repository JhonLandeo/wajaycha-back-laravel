delivery_note: |
  Separate commits on one branch, not a branch per slice. Carried forward from the
  financial-coaching-clarify change, where the owner gave explicit feedback that many
  chained branches are expensive to review and to maintain. Not re-asked here.

review_workload_forecast: |
  Re-forecast by sdd-tasks against the concrete task list in tasks.md.
  400-line budget risk: High. No individual slice literally exceeds 400 lines by estimate
  (380/320/240/300/300 ≈ 1,540 total), but slice 1 sits within ~5% of the ceiling once its
  migration, model, factory, enum, seeder, ~40-item catalogue config, two endpoints, two
  FormRequests and three doc/config edits are all counted with their tests, and estimates
  routinely run under actual authored lines. Kept at High rather than downgraded on the
  estimate alone.
  Decision needed before apply: Yes, under ask-on-risk.
  Chained PRs recommended: Yes — five stacked commits on one branch (Commit 1 -> Commit 5),
  following the precedent the owner set on financial-coaching-clarify, not a branch per slice.
  Chain strategy stacked-to-main was already cached at session start and is not re-asked here.
  Per-slice estimates: 1) products+Unit+registration ~380, 2) pantry_items+CRUD ~320,
  3) consumption_habits+CRUD ~240, 4) grocery_budget_links+pin+ceiling ~300,
  5) ShoppingPlanService+endpoint ~300.

frontend_scope:
  decision: backend-only
  decided_by: owner, 2026-09-26
  rationale: |
    Phase 1 ships the API only. The proposal's affected-areas table listed no
    wajaycha-front-vue path; the frontend brief was added by the orchestrator when
    commissioning design, not by the proposal. Design found the frontend had never been
    counted in any estimate and would have added a sixth slice (~380 lines: one interfaces
    file, one repository, three composables, three views, six components and Vitest tests),
    taking the change to ~1,940 lines.
    The frontend design is written up in design.md and stays there for a later change; it
    costs no review budget now.
  deferred_to: a later change, once the API has been exercised and the list shape is settled.

